# Local development dependencies only. Credentials here are throwaway dev values.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: taproga
      POSTGRES_PASSWORD: taproga
      POSTGRES_DB: taproga
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taproga"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
