[project]
name = "taproga-api"
version = "0.1.0"
description = "Ta Proga backend API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30",
    "cryptography>=50.0.1",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "pyotp>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "ASYNC", "RUF", "SIM", "PT"]
# S105 flags every constant named *PASSWORD*/*TOKEN*; real secret scanning is gitleaks' job in CI.
# N818: domain errors read as outcomes (`NotFound`, `RateLimited`), not `...Error`.
ignore = ["S105", "N818"]
# En dash is correct Lithuanian punctuation in user-facing copy.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]
